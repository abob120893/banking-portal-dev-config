# Local-only reverse proxy. Mirrors the staging box config closely enough
# that signed /api/updates calls behave the same way.
events {
  worker_connections 1024;
}

http {
  server_tokens off;
  sendfile on;

  upstream portal {
    server frontend:3030;
  }

  # Keep the login rate limit so local testing matches staging behaviour.
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api/login {
      limit_req zone=login burst=2 nodelay;
      proxy_pass http://portal;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://portal;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
