version: '3.8'

# Local dev stack for the IRT banking portal.
# Portal image is pulled from my Docker Hub account — see README.
services:
  nginx:
    image: nginx:1.25-alpine
    container_name: portal_nginx
    depends_on:
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - web
    restart: unless-stopped

  frontend:
    image: abob120893/bellwood-portal:dev
    container_name: portal_frontend
    environment:
      - NODE_ENV=production
      - PORT=3030
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - PORTAL_USERNAME=${PORTAL_USERNAME}
      - PORTAL_PASSWORD=${PORTAL_PASSWORD}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASSWORD}
    depends_on:
      - db
    networks:
      - web
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: portal_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    restart: unless-stopped

networks:
  web:
  backend:

volumes:
  pgdata:
